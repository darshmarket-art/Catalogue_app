<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{SEO_TITLE}}</title>
    <meta name="description" content="{{SEO_DESCRIPTION}}" />
    <meta property="og:title" content="{{SEO_TITLE}}" />
    <meta property="og:description" content="{{SEO_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta name="theme-color" content="{{THEME_COLOR}}" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#180e14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/pwa/icon-192.png" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:image:alt" content="{{SITE_NAME}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SEO_TITLE}}" />
    <meta name="twitter:description" content="{{SEO_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Stores: Fraunces + Inter (+ Noto Sans Devanagari for Hindi). The Antarixs site: Instrument Sans. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
      /* The loading screen (see src/components/BootSplash.tsx): shown from the first paint, before the app's own styles load. */
      .boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--color-surface, #f7f1e8); }
      .boot-splash span { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(0, 0, 0, 0.08); border-top-color: var(--color-primary, #4a1835); animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash span { animation-duration: 2.4s; } }
      @media (prefers-color-scheme: dark) { .boot-splash { background: #180e14; } .boot-splash span { border-color: rgba(255, 255, 255, 0.12); border-top-color: #e2c389; } }
    </style>
    {{THEME_STYLE}}
    {{MERCHANT_CONFIG}}
  </head>
  <body class="bg-surface text-on-surface antialiased">
    <div id="root"><div class="boot-splash" aria-hidden="true"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
