<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #fbf4f1; color: #2a1722; }
      h1 { font-size: 26px; margin: 0 0 8px; }
      p { font-size: 16px; line-height: 1.5; margin: 0 0 20px; color: #5d4552; }
      button { min-height: 52px; padding: 0 28px; border: 0; border-radius: 16px; background: #5b2142; color: #fff; font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Check your internet connection, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
