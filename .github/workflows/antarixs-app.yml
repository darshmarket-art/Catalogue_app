name: Antarixs onboarding app

# Builds the Antarixs app for store owners: a native shell that opens app.<base domain>, where they create a store
# and are handed the new store's address. Debug APK only; does not deploy anything.
on:
  workflow_dispatch:
    inputs:
      base_domain:
        description: Platform domain (the app opens https://app.<base_domain>)
        default: antarixs.com
      play_bundle:
        description: Also build a signed release .aab for Google Play (needs the ANDROID_KEYSTORE_* secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: antarixs-app
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_DOMAIN: ${{ inputs.base_domain || 'antarixs.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # Exports PLATFORM_APP=1, APP_ID, APP_NAME and PLATFORM_URL for the later steps (capacitor.config.ts reads them).
      - run: npx tsx scripts/build-platform-app.ts
      # dist/ only supplies offline.html; the app itself loads the live site.
      - run: npm run build:native
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: npx tsx scripts/build-platform-app.ts --icons
      # App push (Firebase). The google-services.json of your Firebase project comes from the GOOGLE_SERVICES_JSON secret;
      # without it the app still builds and runs, only phone notifications stay off.
      - name: Add the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase config added."
          else
            echo "GOOGLE_SERVICES_JSON is not set: building without phone notifications."
          fi
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Name the APK
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "antarixs-$V.apk"
          echo "APK=antarixs-$V.apk" >> "$GITHUB_ENV"
          {
            echo "### Antarixs onboarding app built"
            echo "- App id: \`$APP_ID\`"
            echo "- Opens: $PLATFORM_URL"
            echo "- APK: \`antarixs-$V.apk\` (debug build, see the artifact)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: antarixs-debug-apk-${{ github.run_number }}
          path: ${{ env.APK }}
          retention-days: 30
      # Play upload: versionCode is the run number (always grows), versionName is package.json's version.
      # The keystore is the Play UPLOAD key (PKCS12, alias "upload"); Google re-signs with the app signing key.
      - name: Signed Play bundle
        if: inputs.play_bundle
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KS_B64" ] || { echo "ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          (cd android && ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.p12" \
            -Pandroid.injected.signing.store.password="$KS_PW" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KS_PW")
          rm "$RUNNER_TEMP/upload.p12"
          cp android/app/build/outputs/bundle/release/app-release.aab "antarixs-$V-$GITHUB_RUN_NUMBER.aab"
          echo "AAB=antarixs-$V-$GITHUB_RUN_NUMBER.aab" >> "$GITHUB_ENV"
          echo "- Play bundle: \`antarixs-$V-$GITHUB_RUN_NUMBER.aab\` (versionCode $GITHUB_RUN_NUMBER, signed with the upload key)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.play_bundle
        with:
          name: antarixs-play-aab-${{ github.run_number }}
          path: ${{ env.AAB }}
          retention-days: 30
