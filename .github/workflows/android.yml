name: Android APK

# Builds a debug APK for one merchant. Does not deploy anything.
# Runs on pushes to android-pwa (defaults below) or manually from main.
on:
  push:
    branches: [android-pwa]
  workflow_dispatch:
    inputs:
      merchant:
        description: Merchant id (folder under merchants/)
        default: bhakti
      api_base:
        description: Cloud Run URL the app talks to
        default: https://catalogue-app-456376852191.asia-south1.run.app

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      MERCHANT: ${{ inputs.merchant || 'bhakti' }}
      VITE_API_BASE: ${{ inputs.api_base || 'https://catalogue-app-456376852191.asia-south1.run.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:client
      # ponytail: android/ is generated each run (app id/name change per merchant); commit it once we customise it.
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MERCHANT }}-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
