name: Android APK

# Builds a debug APK for one merchant. Does not deploy anything.
# Runs on pushes to android-pwa (defaults below) or manually from main.
on:
  push:
    branches: [android-pwa]
  workflow_dispatch:
    inputs:
      store_id:
        description: Store id (the subdomain); bhakti uses its committed merchants/bhakti config
        default: bhakti
      api_base:
        description: Cloud Run URL the app talks to
        default: https://catalogue-app-456376852191.asia-south1.run.app

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      STORE_ID: ${{ inputs.store_id || 'bhakti' }}
      VITE_API_BASE: ${{ inputs.api_base || 'https://catalogue-app-456376852191.asia-south1.run.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # Writes merchants/<store>/merchant.json (app id, name, theme); exports MERCHANT, VITE_STORE, VITE_API_BASE, APP_ID.
      - run: npx tsx scripts/build-store-app.ts
        env:
          API_BASE: ${{ env.VITE_API_BASE }}
      - run: npm run build:native
      # ponytail: android/ is generated each run (app id/name change per merchant); commit it once we customise it.
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: npx tsx scripts/build-store-app.ts --icons
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Name the APK store-version
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "$STORE_ID-$V.apk"
          echo "APK=$STORE_ID-$V.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STORE_ID }}-debug-apk-${{ github.run_number }}
          path: ${{ env.APK }}
